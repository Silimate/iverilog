name: "Release (anylinux amd64 + manylinux_2_28 amd64 + macOS arm64)"

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  # Behavior:
  # - Group all pull requests: latest push cancels previous ones
  # - Group all branches: run serially
  group: >
    wheel-${{
      (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'release') ||
      ''
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: '${{ steps.info.outputs.version }}'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_VER=$(bash wheel_build/get_version.sh)
          COUNTER=0
          CURRENT_VER=$BASE_VER
          while gh release view "silimate-v$CURRENT_VER" > /dev/null 2>&1; do
            COUNTER=$(expr $COUNTER + 1)
            CURRENT_VER=$BASE_VER.post$COUNTER
          done
          echo "Found unused version $CURRENT_VER."
          echo "version=$CURRENT_VER" >> $GITHUB_OUTPUT
  wheel-build:
    needs: [version]
    strategy:
      matrix:
        os:
          [
            {
              name: "ubuntu",
              runner: "ubuntu-24.04",
              arch: "x86_64",
            },
            {
              name: "macos",
              runner: "macos-15",
              arch: "arm64",
            },
          ]
    name: Build and Test Binary Wheels | ${{ matrix.os.name }}
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - if: ${{ matrix.os.name == 'macos' && matrix.os.arch == 'arm64' }}
        name: "[macOS/arm64] Install Python 3.8 (see: https://cibuildwheel.pypa.io/en/v3.4.1/faq/#macos-building-cpython-38-wheels-on-arm64)"
        uses: actions/setup-python@v5
        with:
          python-version: 3.8
      - if: ${{ matrix.os.name == 'macos' }}
        # install various dependencies via brew
        run: |
          brew bundle install
          echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix gperf)/bin" >> $GITHUB_PATH
          echo "CMAKE_PREFIX_PATH=$(brew --prefix flex):$(brew --prefix bison):$(brew --prefix gperf)" >> $GITHUB_ENV
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          # Explicit so it can't drift from the upload path below
          output-dir: dist
        env:
          CIBW_ARCHS: ${{ matrix.os.arch }}
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: bash ./wheel_build/before_all_linux.sh
          CIBW_ENVIRONMENT: >
            MACOSX_DEPLOYMENT_TARGET=15
            IVERILOG_WHEEL_VERSION=${{ needs.version.outputs.version }}
          # patchelf version installed by default creates a corrupt ELF binary
          # for vvp
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: pip3 install --upgrade patchelf && auditwheel repair -w {dest_dir} {wheel}
          # smoke test - only run full functionality tests once
          # (takes 3 minutes per target python version)
          CIBW_TEST_COMMAND: (cd {project} && bash wheel_build/smoke_test.sh)
      - name: Full Test
        run: |
          pip3 install --find-links=$PWD/dist/ iverilog
          bash .github/test.sh no-pli1
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.os.name }}-${{ matrix.os.arch }}
          path: dist/*
          if-no-files-found: error
  release:
    runs-on: ubuntu-24.04
    name: Create release
    needs: [version, wheel-build]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: python-wheels-*
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: '${{ needs.version.outputs.version }}'
        run: |
          gh release create "silimate-v$TAG" dist/*.whl \
            --prerelease \
            --repo '${{ github.repository }}' \
            --target '${{ github.sha }}' \
            --generate-notes \
            --notes 'Automated build based on commit ${{ github.sha }}'
      - name: Upload Wheels to Silimate Download Server
        env:
          SERVER_SSH_KEY: ${{ secrets.SILIMATE_SERVER_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p $PWD/ssh
          echo "$SERVER_SSH_KEY" > $PWD/ssh/key
          chmod 600 $PWD/ssh/key
          SSH_OPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -i $PWD/ssh/key"
          rsync --verbose --rsh="ssh $SSH_OPTS" --recursive $PWD/dist/\
            ubuntu@downloads.silimate.com:/usr/share/nginx/pypi/iverilog/
